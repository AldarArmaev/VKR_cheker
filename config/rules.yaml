# =============================================================
# Конфигурация требований к оформлению ВКР
# Редактировать ТОЛЬКО этот файл при смене регламента
# =============================================================

meta:
  version: "2024"
  institution: "ВКР бакалавров (психологический факультет)"

# ──────────────────────────────────────────────
# Объём работы
# ──────────────────────────────────────────────
document:
  type: bachelor
  volume_min_pages: 40    # без приложений
  volume_max_pages: 45
  bibliography_min_sources: 40

# ──────────────────────────────────────────────
# Поля страницы (в сантиметрах)
# ──────────────────────────────────────────────
margins_cm:
  left: 3.0
  right: 1.0
  top: 2.0
  bottom: 2.0
  tolerance: 0.15   # допуск ±0.15 см (~1.5 мм)

# ──────────────────────────────────────────────
# Шрифты
# ──────────────────────────────────────────────
fonts:
  # Единственный разрешённый шрифт для всего документа
  required_font: "Times New Roman"

  sizes:
    body: 14           # основной текст
    table_cell: [11, 12]   # допустимые значения в ячейках
    figure_caption: 12
    table_caption_word: 14   # строка "Таблица N"
    table_caption_title: 14  # название таблицы
    page_number: 12

# ──────────────────────────────────────────────
# Заголовки, в которых разрешён жирный шрифт
# ──────────────────────────────────────────────
headings:
  bold_allowed_patterns:
    - "^Глава\\s+\\d+"
    - "^\\d+\\.\\d+\\."
    - "^Выводы по главе"
    - "^Введение$"
    - "^Заключение$"
    - "^Список литературы$"
    - "^Содержание$"
    - "^(Актуальность|Цель|Объект|Предмет|Гипотез|Задачи|Теоретическая|Общая характеристика|Методы|Структура)"

# ──────────────────────────────────────────────
# Специальные параграфы (исключения из общих правил)
# ──────────────────────────────────────────────
special_paragraphs:
  - pattern: "^Условные обозначения:"
    font_size: 12           # кегль для такого параграфа
    line_spacing: 1.0       # межстрочный интервал
    check_body_indent: false # отступ первой строки не проверяется

  # При необходимости можно добавить другие:
  # - pattern: "^Список сокращений$"
  #   font_size: 12
  #   line_spacing: 1.0
  #   check_body_indent: false

# ──────────────────────────────────────────────
# Межстрочный интервал
# ──────────────────────────────────────────────
spacing:
  body: 1.5              # основной текст (Введение → конец Приложений)
  title_page: 1.0
  contents: 1.0
  table_cell: 1.0
  table_caption_title: 1.5   # название таблицы (строка с текстом)
  figure_caption: 1.0
  empty_line_between_refs: 1.0  # пустая строка после рисунка перед подписью
  tolerance: 0.05        # допуск ±0.05

# ──────────────────────────────────────────────
# Абзацные отступы (первая строка, в сантиметрах)
# ──────────────────────────────────────────────
indents:
  body_first_line: 1.25         # красная строка в основном тексте
  heading_first_line: 0.0       # без отступа у заголовков
  table_caption_first_line: 0.0
  figure_caption_first_line: 0.0
  tolerance: 0.1                # допуск ±0.1 см

# ──────────────────────────────────────────────
# Выравнивание
# ──────────────────────────────────────────────
alignment:
  body: "justify"
  chapter_heading: "center"
  paragraph_heading: "center"
  table_number_line: "right"   # строка "Таблица N"
  table_caption_title: "center" # название таблицы
  figure_caption: "center"
alignment_exceptions:
  - pattern: "^Приложения$"
    expected: "center"
    label: "заголовок приложений"
  - pattern: "^Приложение\\s+\\d+\\s*$"
    expected: "right"
    label: "строка приложения"
indent_exceptions:
  - pattern: "^Приложения$"
    expected_indent: 0.0
    label: "заголовок приложений"
  - pattern: "^Приложение\\s+\\d+\\s*$"
    expected_indent: 0.0
    label: "строка приложения"

# ──────────────────────────────────────────────
# Нумерация страниц
# ──────────────────────────────────────────────
page_numbers:
  position: "right_bottom"
  title_page_numbered: false
  contents_page_numbered: false
  intro_starts_at: 3   # страница Введения = 3

# ──────────────────────────────────────────────
# Стили
# ──────────────────────────────────────────────
styles:
  forbidden:
    - "Heading 1"
    - "Heading 2"
    - "Heading 3"
    - "Heading 4"
    - "Heading 5"
    - "Заголовок 1"
    - "Заголовок 2"
    - "Заголовок 3"
    - "Заголовок 4"
    - "Заголовок 5"
  allowed_body: ["Normal", "Обычный", "Default Paragraph Style"]

# ──────────────────────────────────────────────
# Обязательные разделы
# ──────────────────────────────────────────────
required_sections:
  - pattern: "^Содержание$"
    name: "Содержание"
    new_page: true
  - pattern: "^Введение$"
    name: "Введение"
    new_page: true
  - pattern: "^Глава\\s+1"
    name: "Глава 1"
    new_page: true
  - pattern: "^Выводы по главе"
    name: "Выводы по главе 1"
    new_page: false
  - pattern: "^Глава\\s+2"
    name: "Глава 2"
    new_page: true
  - pattern: "^Заключение$"
    name: "Заключение"
    new_page: true
  - pattern: "^Список литературы$"
    name: "Список литературы"
    new_page: true

# ──────────────────────────────────────────────
# Обязательные подразделы Введения
# ──────────────────────────────────────────────
intro_subsections:
  - keyword: "Актуальность"
    bold_required: true
  - keyword: "Цель"
    bold_required: true
  - keyword: "Объект"
    bold_required: true
  - keyword: "Предмет"
    bold_required: true
  - keyword: "Гипотез"
    bold_required: true
  - keyword: "Задачи"
    bold_required: true
  - keyword: "Теоретическая основа"
    bold_required: true
  - keyword: "Общая характеристика выборки"
    bold_required: true
  - keyword: "Методы и методики"
    bold_required: true
  - keyword: "Структура и объем"
    bold_required: true

# ──────────────────────────────────────────────
# Форматы подписей таблиц и рисунков
# ──────────────────────────────────────────────
captions:
  table_number_pattern: "^Таблица\\s+(\\d+)\\s*$"   # теперь есть группа (\\d+)
  table_name_no_dot: true
  figure_pattern: "^Рис\\.\\s+\\d+\\.\\s+[А-ЯA-ZЁ].+[^.!?]$"
  figure_prefix: "Рис."

# ──────────────────────────────────────────────
# Список литературы
# ──────────────────────────────────────────────
bibliography:
  min_sources: 40
  forbidden_source_types:
    - "учебник"
    - "учебное пособие"
    - "учеб. пособие"
    - "учеб пособие"